image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - lint
  - build
  - test

variables:
  ASPNETCORE_ENVIRONMENT: "Test"

before_script:
  - apt-get update -qq

lint-job:
  tags:
    - ted
  stage: lint
  script:
    - dotnet format  --verify-no-changes --exclude CapEnjoyer.DAL/Migrations

build-job:
  tags:
    - ted
  stage: build
  script:
    - dotnet restore
    - dotnet build

test-job:
  tags:
    - ted
  stage: test
  script:
    - dotnet test Tests --collect="XPlat Code Coverage" --logger:"junit;LogFilePath=testresult.xml" --results-directory:./Coverage
  artifacts:
    reports:
      junit:
        - "*/testresult.xml"
      coverage_report:
        coverage_format: cobertura
        path: "./Coverage/*/coverage.cobertura.xml"
    paths:
      - "./Coverage/*.*" # collect coverage HTMls
